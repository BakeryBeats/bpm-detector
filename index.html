<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bakery Beats - BPM Detector</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at top, #1a1a1a, #0b0b0b);
    color: white;
    min-height: 100vh;
    padding: 24px 16px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.card {
    width: min(440px, 100%);
    background: #151515;
    border-radius: 22px;
    padding: 40px 32px;
    text-align: center;
    border: 1px solid rgba(255, 170, 71, 0.25);
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
}

h1 {
    margin: 0;
    font-size: 28px;
    color: #ffb347;
}

.sub {
    margin-top: 10px;
    font-size: 14px;
    color: #9a9a9a;
}

/* 🔥 spacing fix */
.section {
    margin-top: 30px;
}

input { display: none; }

.dropzone {
    border: 2px dashed rgba(255, 179, 71, 0.4);
    border-radius: 18px;
    padding: 45px 20px;
    cursor: pointer;
    transition: all 0.25s ease;
    background: rgba(255,255,255,0.02);

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.dropzone:hover {
    background: rgba(255, 179, 71, 0.08);
    border-color: #ffb347;
    box-shadow: 0 0 20px rgba(255, 179, 71, 0.25);
    transform: translateY(-2px);
}

.dropzone.active {
    background: rgba(255, 179, 71, 0.15);
    border-color: #ffb347;
}
    
.filetext {
    margin-top: 10px;
    font-size: 13px;
    color: #bdbdbd;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 14px;
    border: none;
    border-radius: 14px;
    background: #ffb347;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
    transition: 0.2s ease;
}

button:hover {
    background: #ff9f1a;
    transform: translateY(-1px);
}

button:disabled {
    background: #444;
    cursor: not-allowed;
}

.loading {
    margin-top: 18px;
    font-size: 13px;
    color: #aaa;
}

/* 🔥 NETTE PROGRESS BAR */
.progress-container {
    width: 100%;
    height: 6px;
    background: #2a2a2a;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 10px;
    display: none;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ffb347, #ff9f1a);
    transition: width 0.3s ease;
}

.result {
    margin-top: 25px;
    font-size: 36px;
    font-weight: bold;
    color: #ffb347;
}
.note { color: #aaa; font-size: 13px; line-height: 1.5; }
.alternatives { display: flex; gap: 10px; }
.alternatives button { margin-top: 12px; background: #29231c; color: #ffb347; }
.dropzone:focus-visible { outline: 2px solid #ffb347; outline-offset: 4px; }
.progress-container.busy .progress-bar { width: 35%; animation: analyzing 1.2s infinite alternate; }
@keyframes analyzing { to { transform: translateX(185%); } }
@media (prefers-reduced-motion: reduce) { .progress-container.busy .progress-bar { animation: none; width: 100%; } }
.site-link {
    display: inline-block;
    margin-top: 14px;
    color: #ffb347;
    font-size: 15px;
    font-weight: bold;
    text-underline-offset: 4px;
}
.site-link:hover { color: #ffd49a; }
.site-link:focus-visible { outline: 2px solid #ffb347; outline-offset: 6px; }
</style>
</head>

<body>

<div class="card">
    <h1>Bakery Beats</h1>
    <div class="sub">Upload your beat → detect BPM 🎧</div>

    <div class="section">
      <label class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Choose an audio file">
    <div style="font-size:16px; font-weight:500;">
        Drop your audio here
    </div>

    <div class="filetext" id="filename" style="margin-top:12px;">
        MP3 / WAV supported
    </div>

    <input type="file" id="fileInput" accept=".mp3,.wav,audio/mpeg,audio/wav">
</label>
    </div>

    <button id="btn" onclick="upload()">Analyze BPM</button>

    <div class="loading" id="loading" role="status" aria-live="polite"></div>

    <div class="progress-container" id="progressContainer">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="result" id="result" aria-live="polite"></div>
    <div class="alternatives" id="alternatives"></div>
    <p class="note" id="tempoNote" hidden>A rhythm can fit half or double tempo. Choose the pulse that matches your beat.</p>
    <p class="note">MP3 / WAV · up to 100 MB. Analyzes the first 2 minutes.<br>Audio is sent to the analysis server and removed after analysis.</p>
    <a class="site-link" href="https://www.elroybakker.nl/" target="_blank" rel="noopener">Explore Bakery Beats &amp; Instrumentals →</a>
</div>

<script>
const fileInput = document.getElementById("fileInput");
const dropzone = document.getElementById("dropzone");
const filename = document.getElementById("filename");
const btn = document.getElementById("btn");
const alternatives = document.getElementById("alternatives");
const tempoNote = document.getElementById("tempoNote");
let busy = false;

function clearResult() {
    document.getElementById("result").textContent = "";
    alternatives.replaceChildren();
    tempoNote.hidden = true;
    document.getElementById("loading").textContent = "";
}

dropzone.addEventListener("keydown", (event) => {
    if ((event.key === "Enter" || event.key === " ") && !busy) {
        event.preventDefault();
        fileInput.click();
    }
});

fileInput.addEventListener("change", () => {
    clearResult();
    if (fileInput.files[0]) {
        filename.innerText = "Selected: " + fileInput.files[0].name;
    }
});

dropzone.addEventListener("dragover", (e) => {
    e.preventDefault();
    dropzone.classList.add("active");
});

dropzone.addEventListener("dragleave", () => {
    dropzone.classList.remove("active");
});

dropzone.addEventListener("drop", (e) => {
    e.preventDefault();
    dropzone.classList.remove("active");
    if (busy) return;
    clearResult();

    fileInput.files = e.dataTransfer.files;

    if (fileInput.files[0]) {
        filename.innerText = "Selected: " + fileInput.files[0].name;
    }
});

async function upload() {
    if (busy) return;
    let file = fileInput.files[0];

    if (!file) {
        alert("Upload a file first");
        return;
    }

    const loading = document.getElementById("loading");
    const result = document.getElementById("result");
    const bar = document.getElementById("progressBar");
    const container = document.getElementById("progressContainer");

    clearResult();
    if (!/\.(mp3|wav)$/i.test(file.name)) {
        loading.textContent = "Choose an MP3 or WAV file.";
        return;
    }
    if (!file.size || file.size > 100 * 1024 * 1024) {
        loading.textContent = "Choose a non-empty file smaller than 100 MB.";
        return;
    }

    busy = true;
    btn.disabled = true;
    fileInput.disabled = true;
    dropzone.setAttribute("aria-disabled", "true");
    loading.innerText = "Analyzing...";
    result.innerText = "";

    container.style.display = "block";
    container.classList.add("busy");
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 180000);
    const warmup = setTimeout(() => {
        loading.textContent = "Still analyzing. The server may need time to wake up…";
    }, 20000);

    let formData = new FormData();
    formData.append("file", file);

    try {
        let response;
        for (let attempt = 0; attempt < 2; attempt++) {
            try {
                response = await fetch("https://home-70iz.onrender.com/upload/", {
                    method: "POST",
                    body: formData,
                    signal: controller.signal
                });
                if (attempt === 0 && [502, 503, 504].includes(response.status)) {
                    throw new TypeError("Analysis server temporarily unavailable");
                }
                break;
            } catch (error) {
                if (error.name === "AbortError" || attempt === 1) throw error;
                loading.textContent = "The analysis server is restarting. Retrying once…";
                await new Promise(resolve => setTimeout(resolve, 3000));
            }
        }

        let data;
        try {
            data = await response.json();
        } catch {
            throw new Error("The analysis server is unavailable. Please try again shortly.");
        }
        if (!response.ok || !Number.isFinite(data.bpm) || data.bpm <= 0) {
            throw new Error(typeof data.detail === "string" ? data.detail : "No tempo found. Try a section with drums.");
        }

        loading.innerText = "";

        result.textContent = data.bpm + " BPM";
        for (const [label, value] of [["Half", data.bpm / 2], ["Detected", data.bpm], ["Double", data.bpm * 2]]) {
            const choice = document.createElement("button");
            const tempo = Math.round(value * 10) / 10;
            choice.textContent = label + " · " + tempo;
            choice.addEventListener("click", () => { result.textContent = tempo + " BPM"; });
            alternatives.append(choice);
        }
        tempoNote.hidden = false;

    } catch (err) {
        loading.textContent = err.name === "AbortError"
            ? "Analysis timed out. Try again or use a shorter audio file."
            : err instanceof TypeError
                ? "The analysis server is temporarily unavailable. Please try again shortly."
                : err.message;
    } finally {
        clearTimeout(timeout);
        clearTimeout(warmup);
        container.style.display = "none";
        container.classList.remove("busy");
        btn.disabled = false;
        fileInput.disabled = false;
        dropzone.removeAttribute("aria-disabled");
        busy = false;
    }
}
</script>

</body>
</html>
